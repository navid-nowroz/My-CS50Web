{% extends "encyclopedia/layout.html" %}

{% block title %}Search[{{ query }}] {% endblock %}

{% block body %}
    <h1>Search Results</h1>

    <ul>
        {% for entry in results %}
            <li>
                <a href="{% url 'show-entry' entry %}">{{ entry }}</a>
            </li>
        {% endfor %}
    </ul>
 {% endblock %}
