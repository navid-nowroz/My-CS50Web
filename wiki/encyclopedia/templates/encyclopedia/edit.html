{% extends "encyclopedia/layout.html" %}

{% block title %}{{title}} [Edit_mode] {% endblock %}

{% block body %}
    <h1>Edit: {{ title }}</h1>
    <hr>
    <form action="{% url 'edit' title %}" method="post">
        {% csrf_token %}
        <input type="hidden" name="title" value='{{ title }}'>
        {{ form }}
        <button type="submit">Submit update</button>
    </form>
{% endblock %}
